spring.application.name=yeohaeng-demo-api
server.address=127.0.0.1
server.port=8088
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
travel.data-file=${TRAVEL_DATA_FILE:./data/workspace.json}
travel.document-root=${TRAVEL_DOCUMENT_ROOT:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Bounded drain lets ordinary oversized uploads receive JSON 413.
server.tomcat.max-swallow-size=32MB
